<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title>Habitación</title>

    <style>

        body{
            font-family: Arial, sans-serif;
            background:#f4f6f8;
            padding:40px;
        }

        .contenedor{
            background:white;
            width:500px;
            margin:auto;
            padding:30px;
            border-radius:12px;
            box-shadow:0 3px 10px rgba(0,0,0,0.1);
        }

        h1{
            color:#163b5c;
            text-align:center;
        }

        label{
            display:block;
            margin-top:15px;
            font-weight:bold;
        }

        input, select{
            width:100%;
            padding:10px;
            margin-top:5px;
            border:1px solid #ccc;
            border-radius:5px;
            box-sizing:border-box;
        }

        button{
            margin-top:25px;
            width:100%;
            padding:12px;
            background:#163b5c;
            color:white;
            border:none;
            border-radius:6px;
            cursor:pointer;
        }

        button:hover{
            background:#24577f;
        }

        a{
            display:block;
            text-align:center;
            margin-top:15px;
            color:#163b5c;
        }

    </style>

</head>

<body>

<div class="contenedor">

    <h1 th:text="${habitacion.idHabitacion == 0 
                  ? 'Registrar Habitación' 
                  : 'Editar Habitación'}">
        Registrar Habitación
    </h1>

    <form th:action="@{/habitaciones/guardar}"
          th:object="${habitacion}"
          method="post">

        <!-- ID OCULTO PARA PODER EDITAR -->
        <input type="hidden"
               th:field="*{idHabitacion}">

        <label>Número de habitación</label>

        <input type="text"
               th:field="*{numero}"
               placeholder="Ejemplo: 101"
               required>

        <label>Tipo</label>

        <select th:field="*{tipo}" required>

            <option value="Simple">Simple</option>
            <option value="Doble">Doble</option>
            <option value="Suite">Suite</option>

        </select>

        <label>Precio</label>

        <input type="number"
               step="0.01"
               min="0"
               th:field="*{precio}"
               placeholder="80.00"
               required>

        <label>Estado</label>

        <select th:field="*{estado}" required>

            <option value="Disponible">Disponible</option>
            <option value="Ocupada">Ocupada</option>
            <option value="Mantenimiento">Mantenimiento</option>
            <option value="Limpieza">Limpieza</option>

        </select>

        <button type="submit"
                th:text="${habitacion.idHabitacion == 0 
                         ? 'Guardar Habitación' 
                         : 'Actualizar Habitación'}">
            Guardar Habitación
        </button>

    </form>

    <a href="/habitaciones">
        Volver a habitaciones
    </a>

</div>

</body>

</html>
